[project]
name = "alpha-genesis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "scipy>=1.12",
  "scikit-learn>=1.4", "lightgbm>=4.3", "optuna>=3.6", "httpx>=0.27"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
alpha-genesis = "alpha_genesis.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["alpha_genesis"]
[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore"]
