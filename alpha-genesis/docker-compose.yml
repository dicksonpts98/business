# docker compose up --build   ->   http://localhost:8000
services:
  alpha-genesis:
    build: .
    ports:
      - "127.0.0.1:8000:8000"      # loopback only: the control endpoints are operator actions
    volumes:
      - ./data:/app/data            # all state: database, bars, models, backups (survives restarts)
      - ./config:/app/config:ro     # risk limits and validation policy are read-only to the application
    environment:
      AG_OPERATOR_TOKEN: ${AG_OPERATOR_TOKEN:-}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
    restart: unless-stopped          # persistent operation: the worker resumes queued and interrupted jobs
