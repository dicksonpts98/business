# RISK GUARDIAN limits. Loaded read-only by guardian.py; changes are operator-only and audited.
starting_capital_cad = 10000.0
risk_per_trade_cad = 50.0
max_daily_loss_cad = 200.0
max_entries_per_day = 20
max_positions = 4
max_total_exposure_x = 2.0       # total notional / equity
leverage_ceiling_x = 2.0
max_instrument_exposure_x = 1.0  # per-instrument notional / equity
stale_data_seconds = 600
fx_stale_days = 4
no_entry_last_minutes = 30
paper_only = true

# Paper-trading modes (operator-only; research code cannot change these).
#   "validated"    — only a promoted champion trades, with the full limits above.
#   "experimental" — when there is no champion, the best Skeptic-approved strategy still in its shadow period may
#                    trade with the reduced limits below. Nothing trades if no strategy has passed the Skeptic.
paper_mode = "validated"
experimental_risk_fraction = 0.25
experimental_max_entries_per_day = 5
experimental_max_daily_loss_cad = 50.0

# LIVE experimental paper trading (orders go to the Alpaca PAPER account during market hours).
# Off until the operator turns the switch on in the dashboard. These limits apply only to that mode.
live_experimental_max_position_cad = 500.0     # maximum notional per position
live_experimental_max_entries_per_day = 2
live_experimental_max_daily_loss_cad = 50.0     # realised + unrealised; new entries stop and positions are closed
live_experimental_leverage_x = 1.0              # no leverage: total open notional never exceeds this x the notional cap x entries
live_experimental_flatten_minutes_before_close = 10   # no overnight positions
