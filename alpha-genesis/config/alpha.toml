# ALPHA GENESIS — operating configuration (research budgets, universe, schedules).
# Risk limits live in risk.toml and validation standards in validation_policy.toml;
# neither of those files is writable by the research engines.
[universe]
symbols = ["SPY", "QQQ", "NVDA", "TSLA"]
market_proxy = "SPY"
bar_minutes = 5

[data]
provider = "synthetic"          # synthetic | csv | parquet | alpaca | alphavantage_mcp
# For real data set provider = "alpaca" and delete data/ (or use a fresh AG_DATA_DIR):
history_start = "2023-01-03"    # alpaca: first session to download
feeds = ["sip", "iex"]          # alpaca: tried in order; a refusal is recorded and the next feed is used
fx_source = "bankofcanada"      # official daily USD/CAD, previous business day
replay_reserve_days = 0         # hold back the last N real sessions and replay them one at a time (sequential test on real data)
synthetic_days = 756
synthetic_initial_days = 560    # remaining sessions are delivered one at a time by the simulated feed
synthetic_seed = 7
synthetic_plant_orb = 0.30        # planted failed-opening-range reversal (positive control); 0 = null market
synthetic_plant_vwap = 0.04
synthetic_decay_start = 660       # session index after which the planted effect vanishes (tests deterioration handling)

[instruments.SPY]
half_spread_bps = 0.5
shortable = true
[instruments.QQQ]
half_spread_bps = 0.6
shortable = true
[instruments.NVDA]
half_spread_bps = 1.5
shortable = true
[instruments.TSLA]
half_spread_bps = 2.0
shortable = true

# Modelled half-spreads for the wider-universe study (no quote data: these are assumptions, not measurements)
[instruments.IWM]
half_spread_bps = 0.8
shortable = true
[instruments.DIA]
half_spread_bps = 0.8
shortable = true
[instruments.AAPL]
half_spread_bps = 0.8
shortable = true
[instruments.MSFT]
half_spread_bps = 0.8
shortable = true
[instruments.AMD]
half_spread_bps = 1.5
shortable = true
[instruments.META]
half_spread_bps = 1.2
shortable = true

[execution]
fee_model = "alpaca"            # "alpaca" (commission-free + regulatory fees) | "legacy" (per-share commission below, pre-v3)
commission_per_share_usd = 0.005
commission_min_usd = 1.0
slippage_bps = 1.0
stress_multiplier = 3.0
participation_cap = 0.02        # max share of a bar's volume one order may take (partial fills beyond)
last_entry_bar = 71             # no new entries in the final 30 minutes
quotes_available = false        # spreads are modelled, not observed

[darwin]
population = 60
generations = 6
optuna_trials = 30
validate_top_k = 10
seed = 11

[learning]
evolve_every_sessions = 20
min_holdout_days = 40
drift_window_days = 20
sim_session_interval_seconds = 0   # 0 = sessions advance only on demand (API/CLI); >0 = auto-advance cadence

[fees.alpaca]
# UNVERIFIED defaults (see backend/alpha_genesis/fees.py). Confirm against Alpaca's current fee disclosure, then set verified = true.
commission_per_share_usd = 0.0
finra_taf_per_share_usd = 0.000166
finra_taf_cap_usd = 8.30
cat_fee_per_share_usd = 0.00004
verified = false
